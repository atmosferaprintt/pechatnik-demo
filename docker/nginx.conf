server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Supabase на том же адресе, что и сайт: некоторые провайдеры режут порт 8000.
    # pechatnik-kong — шлюз нашего Supabase в сети pechatnik_net (server/supabase/).
    # НЕ 172.17.0.1:8000: на общем сервере там Kong Атмосферы.
    # Имя ищется при каждом запросе (resolver докера), поэтому сайт поднимается, даже если Kong ещё стартует.
    location ~ ^/(auth|rest|realtime)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kong http://pechatnik-kong:8000;
        proxy_pass $kong;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 25m;
    }

    # SPA: все пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики с хэшами в имени
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Сжатие. gzip_proxied any — обязательно: без него nginx НЕ жмёт то, что пришло
    # через proxy_pass, то есть все данные Supabase (задачи, операции, история клиентов)
    # ехали несжатыми — ~120 КБ на каждый вход. На VPN и мобильном интернете это заметно.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/vnd.pgrst.object+json application/vnd.pgrst.array+json
               image/svg+xml;
}
